name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          go-version: 1.26.x
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Test
        run: go test -race -coverprofile=coverage.out ./...
      - name: Enforce coverage floor
        run: |
          coverage=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/, "", $3); print $3}')
          awk -v coverage="$coverage" 'BEGIN { if (coverage + 0 < 90) exit 1 }'
      - name: Vet
        run: go vet ./...
      - name: Check vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          set +e
          govulncheck ./... 2>&1 | tee govulncheck.txt
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          if grep -q '^  Module:' govulncheck.txt; then
            exit "$status"
          fi
          if grep -Eq 'affected by [0-9]+ vulnerabilities? from the Go standard library' govulncheck.txt; then
            echo '::warning::Only Go standard-library vulnerabilities were found; update the Go 1.26 runner when a patched release is available.'
            exit 0
          fi
          exit "$status"
